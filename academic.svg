<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="B.Sc. in Computer Science and Engineering at American International University-Bangladesh, in progress. Currently focused on AI/ML and backend development.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#000428"/><stop offset="1" stop-color="#004e92"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5CE1E6"/><stop offset="1" stop-color="#A9FFEB"/></linearGradient>
<linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5CE1E6" stop-opacity="0"/><stop offset="0.5" stop-color="#5CE1E6" stop-opacity="0.16"/><stop offset="1" stop-color="#5CE1E6" stop-opacity="0"/></linearGradient>
<clipPath id="rr"><rect width="900" height="250" rx="18"/></clipPath></defs>
<g clip-path="url(#rr)"><rect width="900" height="250" fill="url(#bg)"/><g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.00s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" dur="0.6s" begin="0.00s" fill="freeze"/><text x="32" y="46" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#EAF6FF">American International University-Bangladesh</text><text x="32" y="72" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8FB3D1">B.Sc. in Computer Science and Engineering (in progress)</text></g><line x1="110" y1="150" x2="800" y2="150" stroke="#1c4a7d" stroke-width="3"/><line x1="580" y1="150" x2="800" y2="150" stroke="#5CE1E6" stroke-width="3" stroke-dasharray="6 8" opacity="0.7"><animate attributeName="stroke-dashoffset" values="0;-28" dur="1.2s" repeatCount="indefinite"/></line><line x1="110" y1="150" x2="110" y2="150" stroke="url(#ac)" stroke-width="3"><animate attributeName="x2" from="110" to="580" dur="2s" begin="0.3s" fill="freeze"/></line><circle r="5" fill="#A9FFEB" opacity="0"><animateMotion path="M110 150 L580 150" dur="2.6s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.6s" begin="3s" repeatCount="indefinite"/></circle><g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.3s" fill="freeze"/><circle cx="110" cy="150" r="10" fill="#5CE1E6" stroke="#5CE1E6" stroke-width="3"></circle><text x="110" y="190" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#EAF6FF">Foundations</text><text x="110" y="212" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8FB3D1">C, C++, OOP, data structures</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.3s" fill="freeze"/><circle cx="345" cy="150" r="10" fill="#5CE1E6" stroke="#5CE1E6" stroke-width="3"></circle><text x="345" y="190" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#EAF6FF">Systems and web</text><text x="345" y="212" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8FB3D1">Java, PHP, C#, SQL, OpenGL</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.3s" fill="freeze"/><circle cx="580" cy="150" r="10" fill="#5CE1E6" stroke="#5CE1E6" stroke-width="3"></circle><circle cx="580" cy="150" r="10" fill="none" stroke="#5CE1E6"><animate attributeName="r" values="10;26" dur="2s" begin="2.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="2s" begin="2.3s" repeatCount="indefinite"/></circle><text x="580" y="190" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#EAF6FF">Now: AI/ML and backend</text><text x="580" y="212" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8FB3D1">ML algorithms, .NET, APIs</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="3.0s" fill="freeze"/><circle cx="800" cy="150" r="10" fill="#000428" stroke="#5CE1E6" stroke-width="3"><animate attributeName="opacity" values="1;0.4;1" dur="1.6s" begin="3.0s" repeatCount="indefinite"/></circle><text x="800" y="190" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#EAF6FF">Next</text><text x="800" y="212" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8FB3D1">ML projects, internships</text></g><rect y="0" width="90" height="250" fill="url(#sw)"><animate attributeName="x" from="-100" to="900" dur="7s" repeatCount="indefinite"/></rect></g></svg>