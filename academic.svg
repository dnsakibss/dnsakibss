<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="B.Sc. in Computer Science and Engineering at American International University-Bangladesh, in progress. Currently focused on AI/ML and backend development." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#000428"/><stop offset="1" stop-color="#004e92"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5CE1E6"/><stop offset="1" stop-color="#A9FFEB"/></linearGradient></defs><rect width="900" height="250" rx="18" fill="url(#bg)"/>
<text x="32" y="46" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#EAF6FF">American International University-Bangladesh</text>
<text x="32" y="72" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8FB3D1">B.Sc. in Computer Science and Engineering (in progress)</text>
<line x1="110" y1="150" x2="800" y2="150" stroke="#1c4a7d" stroke-width="3"/><line x1="110" y1="150" x2="580" y2="150" stroke="url(#ac)" stroke-width="3"/><circle cx="110" cy="150" r="10" fill="#5CE1E6" stroke="#5CE1E6" stroke-width="3"/><text x="110" y="190" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#EAF6FF">Foundations</text><text x="110" y="212" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8FB3D1">C, C++, OOP, data structures</text><circle cx="345" cy="150" r="10" fill="#5CE1E6" stroke="#5CE1E6" stroke-width="3"/><text x="345" y="190" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#EAF6FF">Systems and web</text><text x="345" y="212" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8FB3D1">Java, PHP, C#, SQL, OpenGL</text><circle cx="580" cy="150" r="10" fill="#5CE1E6" stroke="#5CE1E6" stroke-width="3"/><circle cx="580" cy="150" r="10" fill="none" stroke="#5CE1E6"><animate attributeName="r" values="10;24" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite"/></circle><text x="580" y="190" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#EAF6FF">Now: AI/ML and backend</text><text x="580" y="212" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8FB3D1">ML algorithms, .NET, APIs</text><circle cx="800" cy="150" r="10" fill="#000428" stroke="#5CE1E6" stroke-width="3"/><text x="800" y="190" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#EAF6FF">Next</text><text x="800" y="212" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8FB3D1">ML projects, internships</text></svg>