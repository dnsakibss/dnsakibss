<text x="44" y="310" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8FB3D1">Rain, snow, day/night mode, keyboard controls.</text></g><g><rect x="470" y="190" width="430" height="150" rx="14" fill="#06183a" stroke="#1c4a7d"/><rect x="470" y="208" width="4" height="34" rx="2" fill="#5CE1E6"/>
